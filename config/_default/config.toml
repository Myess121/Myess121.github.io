# Change baseurl before deploy
baseurl = "https://Myess121.github.io/"
locale  = "zh-cn"
title   = "Myess"

# Theme i18n support
# See all available values at https://github.com/CaiJimmy/hugo-theme-stack/tree/master/i18n
defaultContentLanguage = "zh"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# 站主不希望网站被搜索引擎收录：不生成 sitemap；robots.txt 允许抓取，好让搜索引擎看到页面里的 noindex 标记（见 layouts/_partials/head/custom.html）
disableKinds = ["sitemap"]
enableRobotsTXT = true


[pagination]
    pagerSize = 5
